[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshservice-exporter"
version = "0.2.0"
description = "Prometheus exporter for Freshservice ITSM metrics"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Surj Bains" }]
keywords = ["prometheus", "freshservice", "freshworks", "exporter", "itsm", "metrics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "prometheus-client>=0.20.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/polarpoint-io/freshservice-exporter"
Repository = "https://github.com/polarpoint-io/freshservice-exporter"
Changelog = "https://github.com/polarpoint-io/freshservice-exporter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "ruff>=0.4",
]

[project.scripts]
freshservice-exporter = "exporter:main"

[tool.setuptools]
py-modules = ["exporter", "client", "dora", "constants", "metrics", "emit"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
