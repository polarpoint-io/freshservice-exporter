name: release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: github.event.release.target_commitish == 'main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version from tag
        id: version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" pyproject.toml
          grep '^version' pyproject.toml

      - name: Build distributions
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

  docker:
    name: Publish release image
    runs-on: ubuntu-latest
    needs: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for PyPI availability
        run: |
          VERSION="${{ needs.pypi.outputs.version }}"
          for i in $(seq 1 30); do
            if python3 -m pip index versions freshservice-exporter 2>/dev/null | grep -q "$VERSION"; then
              echo "freshservice-exporter==$VERSION is available on PyPI"
              exit 0
            fi
            echo "Waiting for freshservice-exporter==$VERSION on PyPI (attempt $i)..."
            sleep 10
          done
          echo "Package did not appear on PyPI in time" >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/polarpoint-io/freshservice-exporter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build & push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.pypi.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
