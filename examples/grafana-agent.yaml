# Grafana Agent (Flow / Alloy-style static scrape) — adapt to your stack.
#
# If using Grafana Cloud, point remote_write at your Prometheus endpoint.

metrics:
  global:
    scrape_interval: 60s
  configs:
    - name: freshservice
      remote_write:
        - url: ${GRAFANA_CLOUD_PROMETHEUS_URL}
          basic_auth:
            username: ${GRAFANA_CLOUD_PROMETHEUS_USER}
            password: ${GRAFANA_CLOUD_PROMETHEUS_TOKEN}
      scrape_configs:
        - job_name: freshservice-exporter
          static_configs:
            - targets: ["freshservice-exporter.monitoring.svc:9192"]
