# Prometheus / Grafana Agent scrape config example.
#
# Add this job to your Prometheus scrape_configs or Grafana Agent metrics config
# that remote-writes to Grafana Cloud.

scrape_configs:
  - job_name: freshservice-exporter
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets:
          - freshservice-exporter:9192
    metrics_path: /metrics
